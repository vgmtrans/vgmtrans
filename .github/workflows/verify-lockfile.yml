name: Verify action lockfile

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install action lockfile generator
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify action dependencies
        run: gh actions-lock --verify
